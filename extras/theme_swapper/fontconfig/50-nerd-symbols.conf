<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fallback: any glyph missing from monospace fonts comes from Symbols Nerd Font -->
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>FiraCode Nerd Font Mono</family>
      <family>Symbols Nerd Font Mono</family>
    </prefer>
  </alias>
  <alias>
    <family>FiraCode Nerd Font Mono</family>
    <default><family>Symbols Nerd Font Mono</family></default>
  </alias>
</fontconfig>
